<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>potopda — a quiet place to keep your files</title>
<meta name="description" content="potopda stores your images, videos and files in MongoDB. Minimal, fast, and yours." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%235b4fe0'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/styles.css" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem('potopda-theme');
      var preferred = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', saved || preferred);
    } catch (e) {}
  })();
</script>
</head>
<body>

  <div class="app">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 28 28" width="28" height="28">
            <rect x="1" y="1" width="26" height="26" rx="8" fill="var(--accent)"></rect>
            <path d="M8 17.5 L12.5 12 L16 15.5 L20 10.5" stroke="var(--paper)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
            <circle cx="20" cy="10.5" r="1.4" fill="var(--paper)"></circle>
          </svg>
        </span>
        <span class="brand-name">potopda</span>
      </div>

      <nav class="tabs" role="tablist" aria-label="Sections">
        <button class="tab is-active" data-category="images" role="tab" aria-selected="true">
          <svg viewBox="0 0 20 20" width="16" height="16"><rect x="2" y="3" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="8" r="1.4" fill="currentColor"/><path d="M3 14l4.5-4.5L11 13l2.5-2.5L17 14" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Images</span>
        </button>
        <button class="tab" data-category="videos" role="tab" aria-selected="false">
          <svg viewBox="0 0 20 20" width="16" height="16"><rect x="2" y="4" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M14 8.5l4-2.2v7.4l-4-2.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span>Videos</span>
        </button>
        <button class="tab" data-category="files" role="tab" aria-selected="false">
          <svg viewBox="0 0 20 20" width="16" height="16"><path d="M5 2.5h7l3 3v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-14a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 2.5v3h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span>Files</span>
        </button>
      </nav>

      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme">
        <svg class="icon-sun" viewBox="0 0 20 20" width="18" height="18"><circle cx="10" cy="10" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M10 1.5v2.2M10 16.3v2.2M3.5 10H1.3M18.7 10h-2.2M4.6 4.6l1.6 1.6M15.4 4.6l-1.6 1.6M4.6 15.4l1.6-1.6M15.4 15.4l-1.6-1.6"/></g></svg>
        <svg class="icon-moon" viewBox="0 0 20 20" width="18" height="18"><path d="M17 11.3A7 7 0 0 1 8.7 3a7 7 0 1 0 8.3 8.3z" fill="currentColor"/></svg>
      </button>
    </header>

    <main class="content">

      <section class="dropzone" id="dropzone">
        <input type="file" id="fileInput" multiple hidden />
        <div class="dropzone-inner">
          <span class="dropzone-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="26" height="26"><path d="M16 21V7M16 7l-5.5 5.5M16 7l5.5 5.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 23v2.5a2.5 2.5 0 0 0 2.5 2.5h15a2.5 2.5 0 0 0 2.5-2.5V23" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          </span>
          <p class="dropzone-text">
            Drop files here, or <button type="button" class="link-btn" id="browseBtn">browse</button>
          </p>
          <p class="dropzone-hint">Images, videos, or anything else — sorted automatically, stored in MongoDB.</p>
        </div>
      </section>

      <div class="upload-queue" id="uploadQueue" hidden></div>

      <section class="gallery">
        <div class="gallery-head">
          <h1 id="galleryTitle">Images</h1>
          <span class="count-pill" id="countPill">0</span>
        </div>

        <div class="grid" id="grid" aria-live="polite"></div>

        <div class="empty-state" id="emptyState" hidden>
          <p>Nothing here yet.</p>
          <p class="empty-sub">Drop a file above to add the first one.</p>
        </div>

        <div class="loading-state" id="loadingState" hidden>Loading…</div>
      </section>

    </main>

    <footer class="footer">
      <p>potopda &copy; ishu</p>
    </footer>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-frame">
      <button class="modal-close" id="modalClose" type="button" aria-label="Close preview">&times;</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/app.js"></script>
</body>
</html>
